plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.10.1'
}

group = 'org.ml'
version = '0.0.1-SNAPSHOT'
description = 'fraud-detection'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Source: https://mvnrepository.com/artifact/ai.djl/bom
    implementation(platform("ai.djl:bom:0.40.0"))

    // Source: https://mvnrepository.com/artifact/ai.djl.onnxruntime/onnxruntime-engine
    implementation("ai.djl.onnxruntime:onnxruntime-engine")

    implementation 'io.grpc:grpc-protobuf:1.85.0'
    implementation 'io.grpc:grpc-stub:1.85.0'
    implementation 'io.grpc:grpc-netty-shaded:1.85.0'
    implementation 'com.google.protobuf:protobuf-java:3.25.9'

    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-webservices'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webservices-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.9'
    }

    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.85.0'
        }
    }

    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
